name: Build EXE

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"
        type: string
      create_release:
        description: "Create a GitHub Release with the EXE?"
        required: true
        default: true
        type: boolean

  push:
    tags:
      - "v*"

jobs:
  build:
    name: "🔨 Build & Publish EXE"
    runs-on: windows-latest

    permissions:
      contents: write   # needed to create releases

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore RunPodClient.csproj

      - name: Publish — single-file self-contained EXE
        run: |
          dotnet publish RunPodClient.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -o publish/

      - name: Rename EXE
        shell: pwsh
        run: |
          $ver = "${{ inputs.version || github.ref_name }}"
          Rename-Item publish\RunPodClient.exe "RunPodClient-$ver-win-x64.exe"
          echo "EXE_NAME=RunPodClient-$ver-win-x64.exe" >> $env:GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RunPodClient-win-x64
          path: publish/${{ env.EXE_NAME }}
          retention-days: 30

      - name: Create GitHub Release
        if: >
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          name: "RunPod Client ${{ inputs.version || github.ref_name }}"
          body: |
            ## RunPod Client ${{ inputs.version || github.ref_name }}

            WinForms .NET 8 client for RunPod Serverless API.

            ### Download
            👇 Download `RunPodClient-*-win-x64.exe` below — no install needed, just run.

            ### Requirements
            - Windows 10/11 x64
            - No .NET installation required (self-contained)

            ### Setup
            1. Run the EXE
            2. Click ⚙️ Settings
            3. Enter your RunPod API key + Endpoint IDs
          files: publish/${{ env.EXE_NAME }}
          draft: false
          prerelease: false
